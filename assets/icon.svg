<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pomoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- 1px Specular Bevel -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <!-- Calyx Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Hero Drop Shadow -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4C0519" flood-opacity="0.55" />
    </filter>

    <!-- Dial Arc Glow -->
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#pomoBg)" />
  <!-- Radial Lighting Sheen -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)" />
  <!-- Inner Specular Rim -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
  <g transform="translate(-102.400 -102.400) scale(1.4)">
<!-- Outer Dial Ring (Radius: 144, Center: 256, 274) -->
  <g filter="url(#heroShadow)">
    <!-- Subdued full track -->
    <circle cx="256" cy="274" r="144" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" stroke-dasharray="3 9" />

    <!-- 25-minute Countdown Arc: Circumference = 2 * PI * 144 ≈ 904.78. 25/60 of 904.78 = 376.99 -->
    <circle cx="256" cy="274" r="144" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="376.99 904.78" transform="rotate(-90 256 274)" filter="url(#arcGlow)" />

    <!-- Dial Tick Marks: 12, 3, 6, 9 o'clock -->
    <line x1="256" y1="116" x2="256" y2="124" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="400" y1="274" x2="392" y2="274" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="256" y1="418" x2="256" y2="410" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="112" y1="274" x2="120" y2="274" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />

    <!-- Tomato Body (Clean crisp porcelain silhouette) -->
    <path d="M 256, 206
             C 292, 198 356, 214 356, 274
             C 356, 336 298, 362 256, 356
             C 214, 362 156, 336 156, 274
             C 156, 214 220, 198 256, 206 Z"
          fill="#FFFFFF" />

    <!-- Clock face inset on tomato -->
    <circle cx="256" cy="282" r="48" fill="#FFF1F2" />
    <!-- Clock Hand indicating focus: 12 and 25 min -->
    <line x1="256" y1="282" x2="256" y2="250" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round" />
    <!-- Minute hand pointing to ~150 degrees (25 min mark): dx = 32 * sin(150°) = 16, dy = -32 * cos(150°) = 27.7 -->
    <line x1="256" y1="282" x2="274" y2="308" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="256" cy="282" r="5" fill="#9F1239" />

    <!-- Emerald Leaf Calyx & Curved Stem on top of tomato -->
    <!-- Stem -->
    <path d="M 256, 206 C 255, 185 264, 168 276, 162" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" />
    <!-- 5-Point Leaf Star -->
    <path d="M 256, 206 L 274, 186 C 270, 198 266, 204 256, 206 Z
             M 256, 206 L 292, 202 C 280, 208 272, 208 256, 206 Z
             M 256, 206 L 238, 186 C 242, 198 246, 204 256, 206 Z
             M 256, 206 L 220, 202 C 232, 208 240, 208 256, 206 Z
             M 256, 206 L 256, 218 C 253, 212 259, 212 256, 206 Z"
          fill="url(#leafGrad)" />
  </g>
  </g>
</svg>