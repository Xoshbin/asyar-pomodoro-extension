<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <style>
      /* Establish the height chain so the view fills the iframe viewport.
         Without this, `.timer-view { height: 100% }` resolves against a
         height-less parent and collapses to content height. */
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/view.ts"></script>
  </body>
</html>
